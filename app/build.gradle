plugins {
    id 'com.android.application'
}

android {
    namespace 'id.badutstore.kalkulator'
    compileSdk 34

    defaultConfig {
        applicationId 'id.badutstore.kalkulator'
        minSdk 23
        targetSdk 34
        versionCode 2
        versionName '1.1'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }
}
