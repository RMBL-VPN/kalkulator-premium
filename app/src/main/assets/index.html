<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#08060f">
<title>Kalkulator Premium RMBL</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:#08060f;color:#f5f7ff;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}body{display:flex;justify-content:center;align-items:center;padding:18px}.app{width:100%;max-width:440px}.artwork{display:block;width:100%;height:auto;max-height:180px;object-fit:contain;margin:0 auto 14px;filter:drop-shadow(0 0 18px #7d20ff55)}.top{display:flex;justify-content:space-between;align-items:center;margin:0 2px 20px}.brand{font-size:12px;font-weight:800;letter-spacing:2px;color:#c4a6ff}.subtitle{font-size:13px;color:#8995ad;margin-top:5px}.badge{border:1px solid #59427d;background:#29223b;color:#e0caff;padding:9px 12px;border-radius:12px;font-size:11px;font-weight:800;letter-spacing:1px}.screen{background:linear-gradient(145deg,#1a1029,#10131c);border:1px solid #57317d;border-radius:24px;padding:24px 18px 20px;min-height:145px;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-end;overflow:hidden;box-shadow:0 12px 30px #0002}.history{color:#8d9ab3;font-size:14px;min-height:22px;overflow-wrap:anywhere;text-align:right}.display{font-size:clamp(36px,10vw,52px);font-weight:750;line-height:1.35;overflow-wrap:anywhere;max-width:100%;text-align:right;letter-spacing:-1px}.keys{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:16px}.key{height:clamp(58px,12vw,72px);border-radius:19px;border:1px solid #303647;background:#222735;color:#f7f8ff;font-size:22px;font-weight:650;box-shadow:inset 0 1px #ffffff08;cursor:pointer;touch-action:manipulation}.key:active{filter:brightness(1.35);transform:scale(.97)}.fn{background:#302044;color:#d8b4fe}.op{background:#1c3b20;color:#7dff59;border-color:#35d54c}.green{background:#143d1e;color:#70ff4f;border-color:#28e84c}.eq{background:linear-gradient(135deg,#5dff24,#16b800);color:white;border:0;box-shadow:0 6px 16px #7a4ae344}.wide{grid-column:span 2}.foot{text-align:center;color:#68748b;font-size:11px;margin-top:20px;letter-spacing:.5px}@media(min-height:750px){body{align-items:center}.screen{min-height:165px}.key{height:70px}}
</style></head>
<body><main class="app" aria-label="Kalkulator Premium">
<header class="top"><div><div class="brand">✦ KALKULATOR PREMIUM</div><div class="subtitle">Hitung cepat, hasil akurat</div></div><div class="badge">RMBL ✦</div></header><img class="artwork" src="rmbl-premium.png" alt="Kalkulator neon RMBL">
<section class="screen"><div id="history" class="history" aria-live="polite">Siap menghitung</div><div id="display" class="display" aria-live="polite">0</div></section>
<div class="keys" id="keys">
<button class="key fn" data-action="clear">AC</button><button class="key fn" data-action="back">⌫</button><button class="key fn" data-action="percent">%</button><button class="key op" data-op="÷">÷</button>
<button class="key" data-num="7">7</button><button class="key" data-num="8">8</button><button class="key" data-num="9">9</button><button class="key op" data-op="×">×</button>
<button class="key" data-num="4">4</button><button class="key" data-num="5">5</button><button class="key" data-num="6">6</button><button class="key op" data-op="−">−</button>
<button class="key" data-num="1">1</button><button class="key" data-num="2">2</button><button class="key" data-num="3">3</button><button class="key op" data-op="+">+</button>
<button class="key green" data-action="sign">+/−</button><button class="key" data-num="0">0</button><button class="key" data-action="decimal">.</button><button class="key eq" data-action="equals">=</button>
</div><footer class="foot">RMBL • OFFLINE • PREMIUM</footer></main>
<script>
(()=>{const display=document.getElementById('display'),history=document.getElementById('history'),keys=document.getElementById('keys');let current='0',stored=null,operator=null,replace=false,done=false;const fmt=n=>{if(!Number.isFinite(n))return 'Error';if(Math.abs(n)<1e15)return String(Number(n.toPrecision(12)));return n.toExponential(6)};const paint=()=>display.textContent=current;function reset(){current='0';stored=null;operator=null;replace=false;done=false;history.textContent='Siap menghitung';paint()}function inputNum(n){if(current==='Error'||replace||done){current=n;replace=false;done=false;if(!operator)history.textContent=''}else if(current==='0')current=n;else if(current.replace('-','').length<15)current+=n;paint()}function calc(a,b,o){return o==='+'?a+b:o==='−'?a-b:o==='×'?a*b:o==='÷'?(b===0?NaN:a/b):b}function chooseOp(o){if(current==='Error')return;let n=Number(current);if(operator&&!replace){let r=calc(stored,n,operator);if(!Number.isFinite(r)){current='Error';stored=null;operator=null;history.textContent='Tidak bisa membagi dengan nol';paint();return}current=fmt(r);stored=Number(current)}else stored=n;operator=o;replace=true;done=false;history.textContent=fmt(stored)+' '+o;paint()}function equals(){if(!operator||stored===null||current==='Error')return;let a=stored,b=Number(current),o=operator;history.textContent=fmt(a)+' '+o+' '+fmt(b)+' =';current=fmt(calc(a,b,o));stored=null;operator=null;replace=true;done=true;paint()}function action(a){if(a==='clear')return reset();if(a==='back'){if(replace||done||current==='Error'){current='0';replace=false;done=false}else current=current.length>1?current.slice(0,-1):'0';paint();return}if(a==='decimal'){if(replace||done||current==='Error'){current='0.';replace=false;done=false}else if(!current.includes('.'))current+='.';paint();return}if(a==='sign'){if(current!=='0'&&current!=='Error')current=current.startsWith('-')?current.slice(1):'-'+current;paint();return}if(a==='percent'){if(current!=='Error'){current=fmt(Number(current)/100);replace=false;done=false;paint()}return}if(a==='equals')equals()}keys.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.num!==undefined)inputNum(b.dataset.num);else if(b.dataset.op)chooseOp(b.dataset.op);else if(b.dataset.action)action(b.dataset.action)});document.addEventListener('keydown',e=>{if(/^[0-9]$/.test(e.key))inputNum(e.key);else if(e.key==='.')action('decimal');else if(['+','-','*','/'].includes(e.key)){e.preventDefault();chooseOp(({'+':'+','-':'−','*':'×','/':'÷'})[e.key])}else if(e.key==='%')action('percent');else if(e.key==='Enter'||e.key==='='){e.preventDefault();equals()}else if(e.key==='Backspace')action('back');else if(e.key==='Escape')reset()})})();
</script></body></html>
